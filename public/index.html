<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Debate Arena</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">AI Debate Arena</p>
            <h1>AI 辩论工作台</h1>
          </div>
          <div class="top-actions">
            <button class="icon-button" id="exportMarkdown" title="导出 Markdown" aria-label="导出 Markdown">
              <span aria-hidden="true">↓</span>
            </button>
            <button class="icon-button" id="exportJson" title="导出 JSON" aria-label="导出 JSON">
              <span aria-hidden="true">{ }</span>
            </button>
            <button class="danger-button" id="resetDebate">重置</button>
          </div>
        </header>

        <section class="debate-stage" aria-label="辩论记录">
          <div class="status-strip">
            <div>
              <span>当前环节</span>
              <strong id="currentRound">准备中</strong>
            </div>
            <div>
              <span>进度</span>
              <strong id="progressLabel">0 / 0</strong>
            </div>
            <div>
              <span>模式</span>
              <strong id="modeLabel">模拟 AI</strong>
            </div>
          </div>

          <div id="transcript" class="transcript empty">
            <div class="empty-state">
              <h2>设置议题后开始辩论</h2>
              <p>双方 AI 会按开篇、反驳、质询、总结和裁判点评推进。没有 API key 时也能先用模拟模式跑完整流程。</p>
            </div>
          </div>

          <div class="stage-actions">
            <button class="primary-button" id="startDebate">开始辩论</button>
            <button id="nextTurn" disabled>下一位发言</button>
            <button id="autoRun" disabled>自动跑完</button>
          </div>
        </section>
      </section>

      <aside class="control-panel" aria-label="辩论设置">
        <form id="settingsForm">
          <section class="panel-section">
            <h2>议题</h2>
            <label>
              辩题
              <textarea id="topic" rows="4">AI 是否应该被允许参与高风险公共决策？</textarea>
            </label>
            <div class="grid-two">
              <label>
                正方
                <input id="sideA" value="应该允许，但必须被审计和问责" />
              </label>
              <label>
                反方
                <input id="sideB" value="不应该允许，只能作为辅助参考" />
              </label>
            </div>
          </section>

          <section class="panel-section">
            <h2>规则</h2>
            <div class="grid-two">
              <label>
                轮数
                <input id="roundCount" type="number" min="1" max="3" value="1" />
              </label>
              <label>
                每次字数
                <input id="maxTokens" type="number" min="120" max="1600" step="20" value="520" />
              </label>
            </div>
            <label>
              裁判标准
              <textarea id="judgeCriteria" rows="3">清晰定义、证据质量、回应力度、现实可执行性、对风险的处理。</textarea>
            </label>
          </section>

          <section class="panel-section">
            <h2>AI 设置</h2>
            <label class="toggle-row">
              <span>使用真实模型</span>
              <input id="liveMode" type="checkbox" />
            </label>
            <label>
              API Key
              <input id="apiKey" type="password" placeholder="可留空，留空会使用模拟 AI" autocomplete="off" />
            </label>
            <label>
              Base URL
              <input id="baseUrl" value="https://api.openai.com/v1" />
            </label>
            <div class="grid-two">
              <label>
                模型
                <input id="model" value="gpt-4.1-mini" />
              </label>
              <label>
                创造度
                <input id="temperature" type="number" min="0" max="1.5" step="0.1" value="0.7" />
              </label>
            </div>
          </section>
        </form>
      </aside>
    </main>

    <template id="messageTemplate">
      <article class="message">
        <div class="message-meta">
          <span class="speaker"></span>
          <span class="round"></span>
        </div>
        <div class="message-body"></div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
